# Development tools for this repository. Not a package: there is no
# [build-system], there is no code, and nothing here is installed except the
# dev group - the markdown formatter.
#
#   python -m venv .venv
#   .venv/Scripts/python -m pip install --upgrade pip  # --group needs pip 25.1+
#   .venv/Scripts/python -m pip install --group dev    # Windows; .venv/bin/ elsewhere

[project]
name = "hed-repos-admin"
version = "0.0.0"
description = "Coordination documents for the HED-related repositories."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-front-matters==2.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-myst==0.3.0",
]
